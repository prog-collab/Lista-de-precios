<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La gestión se mudó</title>
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="icon-192.png">
<style>
  body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
       background:#0f172a; color:#e2e8f0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       padding:24px; text-align:center; line-height:1.6}
  .caja{max-width:420px}
  h1{font-size:20px; margin:0 0 12px}
  p{font-size:15px; color:#94a3b8; margin:0 0 18px}
  a.btn{display:inline-block; background:#0284c7; color:#fff; text-decoration:none;
        padding:13px 20px; border-radius:12px; font-size:16px; font-weight:600}
  .chico{font-size:13px; margin-top:18px}
</style>
</head>
<body>
<div class="caja">
  <h1>La gestión ahora está en camerino.com.ar</h1>
  <p>Te estamos llevando a la dirección nueva. Si no pasa nada, tocá el botón.</p>
  <a class="btn" id="ir" href="https://www.camerino.com.ar/gestion">Abrir el sistema de gestión</a>
  <p class="chico">Importante: borrá el acceso directo viejo de la pantalla del celular
     y volvé a instalar la app desde la dirección nueva.</p>
</div>
<script>
// Esta página reemplaza a la app vieja en GitHub Pages. Antes de mandar a la
// dirección nueva hay que desarmar el service worker y su caché: si no, el
// celular puede seguir sirviendo la app vieja desde adentro y quedarse
// trabajando sobre una versión que ya nadie actualiza.
(async () => {
  try {
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    if (window.caches) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  } catch (e) { /* si algo falla, igual seguimos al destino */ }
  location.replace('https://www.camerino.com.ar/gestion');
})();
</script>
</body>
</html>
